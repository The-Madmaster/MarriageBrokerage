# H2 Database for Development 
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Database Configuration (SQL Server) - Uncomment below and comment above for SQL Server
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=marriage_brokerage;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=YourPassword123
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
# Removed explicit servlet context path to avoid duplicating '/api' since controllers already include '/api' in their @RequestMapping paths.
# If you prefer a global context path, delete '/api' from controller-level @RequestMapping annotations instead of re‑adding this.
# server.servlet.context-path=/api

# JWT Configuration
jwt.secret=MahiMarriageBrokerageSecretKeyForJWTTokenGeneration2024
jwt.expiration=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.mahi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Configuration
app.name=Mahi Marriage Brokerage System
app.version=1.0.0