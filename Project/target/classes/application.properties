# H2 Database for Development 
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Database Configuration (SQL Server) - Uncomment below and comment above for SQL Server
# spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=marriage_brokerage;trustServerCertificate=true
# spring.datasource.username=sa
# spring.datasource.password=YourPassword123
# spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# JWT Configuration
jwt.secret=MahiMarriageBrokerageSecretKeyForJWTTokenGeneration2024
jwt.expiration=86400000
jwt.refresh-expiration=604800000 # 7 days in ms

# Security Hardening
security.auth.max-failed-attempts=5
security.auth.lockout-minutes=15
security.rate-limit.window-seconds=60
security.rate-limit.max-attempts=30

# MFA (acceptable values: NONE, EMAIL, TOTP)
mfa.enabled=true
mfa.issuer=MarriageBrokerage
mfa.email.code-expiration-seconds=300
mfa.email.max-attempts=5

# Encryption (Base64 key length 32 bytes recommended for AES-256)
crypto.secret=VGhpc0lzQVNlY3JldEtleUZvck1hcmlhZ2VCcm9rZXJhZ2U=

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging Configuration
logging.level.com.mahi=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Configuration
app.name=Mahi Marriage Brokerage System
app.version=1.0.0